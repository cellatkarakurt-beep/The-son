<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IP Takip</title>
<style>
body {
  background: black;
  color: lime;
  font-family: monospace;
  font-size: 20px;
}
</style>
</head>
<body>

<h2>IP Bilgisi</h2>
<pre id="info">Yükleniyor...</pre>

<script>
async function updateIP() {
  const time = new Date().toLocaleTimeString('tr-TR', {
    hour12: false
  });

  try {
    const res = await fetch(
      "http://ip-api.com/json/?fields=status,country,city,query"
    );
    const data = await res.json();

    document.getElementById("info").textContent =
`Saat: ${time}

Ülke: ${data.country}
Şehir: ${data.city}
IP: ${data.query}`;
    
  } catch {
    document.getElementById("info").textContent =
      "IP bilgisi alınamadı";
  }
}

setInterval(updateIP, 1000);
updateIP();
</script>

</body>
</html>
